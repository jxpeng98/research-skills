[workspace]
resolver = "3"
members = [
    "apps/qiongli",
    "crates/qiongli-config",
    "crates/qiongli-content",
    "crates/qiongli-execution",
    "crates/qiongli-platform",
    "crates/qiongli-project",
    "crates/qiongli-runtime",
    "crates/qiongli-ui",
    "crates/qiongli-windows-security",
]
default-members = ["apps/qiongli"]

[workspace.package]
version = "2.0.0-beta.1"
edition = "2024"
rust-version = "1.97"
authors = ["Jiaxin Peng"]
license = "MIT"
repository = "https://github.com/jxpeng98/qiongli"
publish = false

[workspace.metadata.qiongli]
product = "qiongli"
channel = "beta"

[workspace.dependencies]
agent-client-protocol = "=2.1.0"
async-io = "=2.6.0"
event-listener = "=5.4.1"
crc32fast = "1.5.0"
dunce = "1.0.5"
quick-xml = "0.36.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json"] }
rfd = { version = "=0.17.2", default-features = false, features = ["wayland", "xdg-portal"] }
schemars = "=1.2.1"
ed25519-dalek = "3.0.0"
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui = { version = "=0.35.0", default-features = false, features = ["default_fonts"] }
egui_kittest = { version = "=0.35.0", default-features = false }
getrandom = "0.3.4"
futures = "=0.3.32"
png = "=0.18.1"
same-file = "1.0.6"
rustix = { version = "1.1.3", features = ["fs", "process"] }
semver = "1.0.26"
security-framework = "3.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
tauri = { version = "=2.11.5", default-features = true }
tauri-plugin-opener = { version = "=2.5.4" }
tauri-build = { version = "=2.6.3", default-features = false }
thiserror = "1.0.69"
unicode-normalization = "0.1.25"
url = "2.5.8"
zeroize = "1.9.0"

[profile.test]
# Keep the canonical test binary inside the bounded plugin-composer input limit.
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
disallowed_methods = "deny"
todo = "deny"
unimplemented = "deny"
