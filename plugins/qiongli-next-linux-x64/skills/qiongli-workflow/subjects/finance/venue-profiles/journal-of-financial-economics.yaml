id: journal-of-financial-economics
display_name: "Journal of Financial Economics"
discipline: finance
quality_bar:
  - "Empirical claim must be tied to credible identification or risk-adjusted interpretation."
  - "Data construction, event timing, and sample filters must be replicable."
  - "Tables must distinguish baseline, controls, fixed effects, and robustness."
fit_notes:
  - "Best fit for corporate finance, asset pricing, governance, banking, and market microstructure papers."
  - "Use event, panel, or portfolio design only when timing and comparison groups are credible."
  - "Explain economic magnitude before broad implications."
