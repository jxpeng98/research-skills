name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this immutable native prerelease tag after release verification
        type: boolean
        default: false
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # Required for trusted publishing

jobs:
  build-and-publish:
    if: ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'v2.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/qiongli
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject native release lines
        run: |
          release_line="$(python3 scripts/release_version.py "${RELEASE_TAG}" --print-field release_line)"
          if [[ "$release_line" == "native-2x" ]]; then
            echo "[pypi-publish] RLS-201/PKG gate: native 2.x tags must not publish the frozen Python package" >&2
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install -e . build twine

      - name: Inject packaged upstream defaults
        env:
          RESEARCH_SKILLS_REPO_SLUG: jxpeng98/qiongli
        run: bash scripts/inject_project_toml.sh

      - name: Materialize distribution payloads
        run: python3 scripts/materialize_distribution_payloads.py --target all --out "$RUNNER_TEMP/qiongli-dist" --force

      - name: Verify tag matches repo version
        run: bash scripts/verify_release_tag_version.sh --root "$RUNNER_TEMP/qiongli-dist" --tag "${RELEASE_TAG}"

      - name: Build package
        run: cd "$RUNNER_TEMP/qiongli-dist" && python -m build

      - name: Validate package
        run: cd "$RUNNER_TEMP/qiongli-dist" && twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/qiongli-dist/dist

  publish-native:
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v2.')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref_type == 'tag' && startsWith(github.ref_name, 'v2.')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Download verified three-platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"
          python tooling/scripts/native_release_assets.py verify --root "$RUNNER_TEMP/assets" --version "$RELEASE_TAG" --commit "$GITHUB_SHA" --require-ci
      - name: Select platform wheels
        run: |
          python - <<'PYTHON'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          out = root / 'pypi'
          out.mkdir()
          for wheel in (root / 'assets').glob('*.whl'):
              shutil.copyfile(wheel, out / wheel.name)
          PYTHON
          python -m pip install twine
          python -m twine check "$RUNNER_TEMP/pypi/"*.whl
      - name: Publish native wheels through existing trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/pypi
