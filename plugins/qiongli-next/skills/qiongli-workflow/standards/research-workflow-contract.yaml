paper_types:
  - id: "empirical"
    focus: "design, data, methods, results, validity"
  - id: "qualitative"
    focus: "qualitative design, sampling, coding, interpretation, trustworthiness"
  - id: "systematic-review"
    focus: "PRISMA search-screen-extract-synthesize-report"
  - id: "methods"
    focus: "new method + validation + comparative evidence"
  - id: "theory"
    focus: "constructs, propositions, conceptual contribution"

academic_project_types:
  - "journal_manuscript"
  - "research_paper"
  - "coursework"
  - "capstone"
  - "dissertation"
  - "thesis"
  - "presentation"

literature_evidence_bundle:
  shared_artifacts:
    - "search_strategy.md"
    - "search_log.md"
    - "search_results.csv"
    - "dedup_log.csv"
    - "snowball_log.md"
    - "bibliography.bib"
    - "screening/full_text.md"
    - "retrieval_manifest.csv"
  provider_roles:
    scholarly-search:
      owns:
        - "search_strategy.md"
        - "search_log.md"
        - "search_results.csv"
      appends:
        - "dedup_log.csv"
      responsibilities:
        - "query planning and provider-specific query translation"
        - "raw provider hit capture before screening"
        - "initial dedup candidate generation"
    citation-graph:
      owns:
        - "snowball_log.md"
      appends:
        - "search_results.csv"
        - "dedup_log.csv"
      responsibilities:
        - "forward/backward seed expansion"
        - "traceable corpus growth beyond direct query hits"
    metadata-registry:
      owns:
        - "bibliography.bib"
      appends:
        - "dedup_log.csv"
      responsibilities:
        - "identifier normalization and merge decisions"
        - "author/venue/year/DOI normalization"
        - "citekey stabilization for downstream notes and exports"
        - "normalize reference state from bibliography.bib, references.json, references.ris, search_results.csv, or notes/"
    fulltext-retrieval:
      owns:
        - "screening/full_text.md"
        - "retrieval_manifest.csv"
      responsibilities:
        - "full-text access resolution"
        - "version and provenance tracking"
        - "retrieval status needed for PRISMA-style reporting"

academic_context_continuity:
  artifacts:
    - "context/research_state.md"
    - "context/decision_log.md"
    - "context/boundary_review.md"
  refresh_points:
    A: "Lock the working research question, scope boundaries, construct definitions, contribution thesis, and venue-positioning assumptions."
    B: "Summarize the literature topology, inclusion/exclusion logic, evidence gaps, and contested concepts that must survive into design and writing."
    C: "Record design commitments, identification logic, measurement choices, dataset constraints, and preregistration-facing decision rules."
    D: "Update ethics constraints, privacy limits, deidentification commitments, and any design changes forced by participant-risk or governance concerns."
    E: "Distinguish stable findings from tentative signals, document heterogeneity/nulls/conflicts, and preserve the current evidence position before manuscript drafting."
    F: "Carry forward the manuscript thesis, claims-evidence alignment status, interpretation boundaries, and remaining narrative or analytical fragilities."
    H: "Summarize reviewer-sensitive weaknesses, locked revision strategy, unresolved fatal risks, and submission-readiness blockers."
    L: "Preserve assignment brief, rubric criteria, learning outcomes, AI-policy status, word count, user-supplied evidence, and unresolved submission risks."
    M: "Preserve degree level, dissertation type, chapter status, supervisor feedback, milestone constraints, ethics dependencies, and unresolved evidence gaps."
  research_state_required_sections:
    - "Paper identity and current stage status"
    - "Current research question, thesis, or contribution claim"
    - "Scope boundaries and contested definitions"
    - "Locked decisions with rationale and confidence"
    - "Stable findings or current evidence position"
    - "Active contradictions, nulls, or unresolved disputes"
    - "Current risk register and fragility points"
    - "Next-stage priorities"
    - "Source artifact anchors"
  decision_log_required_fields:
    - "decision_id"
    - "stage"
    - "decision"
    - "status"
    - "rationale"
    - "alternatives_rejected"
    - "evidence_basis"
    - "revisit_trigger"
    - "downstream_impact"
  boundary_review_required_sections:
    - "academic boundary map"
    - "claim strength and evidence threshold"
    - "claim_strength_boundary"
    - "evidence_threshold_boundary"
    - "method_validity_boundary"
    - "rival explanations and validity risks"
    - "generalizability and venue limits"
    - "generalizability_boundary"
    - "research code, submission, or presentation commitments when relevant"
    - "research_code_boundary"
    - "submission_revision_boundary"
    - "locked decisions and revisit triggers"
    - "revisit_trigger"
  boundary_refresh_points:
    A: "Refresh phenomenon, construct, contribution, claim strength, and evidence threshold boundaries."
    B: "Refresh literature corpus, inclusion/exclusion, and rival-literature boundaries."
    C: "Refresh method-validity, operationalization, and claim-strength boundaries."
    D: "Refresh consent, privacy, governance, and disclosure boundaries."
    E: "Refresh synthesis, pooling, heterogeneity, and certainty boundaries."
    F: "Refresh claim-evidence, interpretation, implication, and limitation boundaries."
    G: "Refresh reporting, checklist, and compliance boundaries."
    H: "Refresh submission, rebuttal, reviewer-promise, and fatal-flaw boundaries."
    I: "Refresh code/data lineage, reproducibility, and analysis-validity boundaries."
    J: "Refresh final wording and meaning-preservation boundaries."
    K: "Refresh presentation claim, audience, and disclosure boundaries."
    L: "Refresh rubric, learning-outcome, permitted-assistance, source-use, and personal-evidence boundaries."
    M: "Refresh chapter, supervisor-feedback, ethics, milestone, claim-evidence, and defense-readiness boundaries."

