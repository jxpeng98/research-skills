# Codex supplied-entry routing-intent probe: 24 bilingual groups, 48 requests.
# All studies, drafts, project states and prior results below are synthetic.
# This does not test real Host activation, tool availability or execution.
# Expected lists enumerate acceptable labels, not a sequence of required routes.
# Route selects the current remaining work, not the artifact's original stage.
# V2 separates a necessary lookup/project read from the remaining task owner.
# next_action describes the current text-only response, never a future tool call.

- id: supplied-abstract-explanation
  category: activation
  request:
    en: >-
      Explain this supplied academic abstract in two sentences, without saving
      anything: "In a cross-sectional survey of 120 university students, study
      time was positively associated with examination score (r = .32). The
      authors state that causality cannot be inferred." I study learning habits.
    zh: >-
      请用两句话解释这段给定的学术摘要，不保存任何内容：“在一项针对120名大学生的
      横断面调查中，学习时间与考试成绩呈正相关（r = .32）。作者说明不能据此推断
      因果。”我研究学习习惯。
  expected:
    route: [workflows/paper-read.md]
    resource_route: [none]
    scope: [direct]
    next_action: [answer]

