      Return citations and one relevance sentence for each, not a systematic
      review or saved artifact. I need actual papers, not only a search strategy.
      No web search or literature-provider tool is available, and I have not
      supplied candidate records or source texts.
    zh: >-
      请找三篇2020至2024年发表、经过同行评审的实证论文，主题是大学生睡眠时长与考试
      表现。每篇返回引文和一句相关性说明，不做系统综述，也不保存文件。我需要实际
      论文，而不只是检索策略。当前没有网络检索或文献提供方工具，我也没有提供候选
      记录或来源文本。
  expected:
    route: [skills/B_literature/academic-searcher.md]
    resource_route: [none]
    scope: [direct]
    next_action: [request_evidence]

