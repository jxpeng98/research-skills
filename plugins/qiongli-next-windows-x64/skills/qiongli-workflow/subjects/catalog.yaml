subjects:
  core:
    display_name: Qiongli Core
    package_goal: "General-purpose Qiongli academic workflow across paper types and methods."
    domain_profiles:
      - accounting
      - economics
      - finance
      - psychology
      - biomedical
      - education
      - cs-ai
      - business-management
      - political-economy
      - geoeconomics
      - epidemiology
      - political-science
      - ecology-environmental
      - custom-template
    venue_profiles:
      - acl
      - aom
      - chi
      - jama
      - nature
      - neurips
    skill_groups:
      - order: 1
        heading: "Research Framing"
        subheading: "Question, contribution, theory, and venue fit"
        stages: ["A"]
        skill_refs:
          - question-refiner
          - contribution-crafter
          - hypothesis-generator
          - theory-mapper
          - gap-analyzer
          - venue-analyzer
      - order: 2
        heading: "Literature Grounding"
        subheading: "Search, screening, extraction, citation, and mapping"
        stages: ["B"]
        skill_refs:
          - academic-searcher
          - paper-screener
          - paper-extractor
          - citation-snowballer
          - fulltext-fetcher
          - citation-formatter
          - concept-extractor
          - literature-mapper
          - reference-manager-bridge
      - order: 3
        heading: "Study Design"
        subheading: "Design, variables, data, preregistration, and robustness"
        stages: ["C"]
        skill_refs:
          - study-designer
          - rival-hypothesis-designer
          - robustness-planner
          - dataset-finder
          - variable-constructor
          - data-dictionary-builder
          - data-management-plan
          - prereg-writer
          - variable-operationalizer
      - order: 4
        heading: "Ethics and Disclosure"
        subheading: "IRB, participant protection, and disclosure statements"
        stages: ["D"]
        skill_refs:
          - ethics-irb-helper
          - statement-generator
          - deidentification-planner
      - order: 5
        heading: "Evidence Synthesis"
        subheading: "Effect sizes, synthesis, quality, and publication-bias checks"
        stages: ["E"]
        skill_refs:
          - effect-size-calculator
          - evidence-synthesizer
          - quality-assessor
          - publication-bias-checker
          - qualitative-coding
      - order: 6
        heading: "Manuscript Writing"
        subheading: "Architecture, interpretation, tables, figures, and discussion"
        stages: ["F"]
        skill_refs:
          - manuscript-architect
          - proposal-writer
          - analysis-interpreter
          - effect-size-interpreter
          - table-generator
          - figure-specifier
          - meta-optimizer
          - discussion-writer
      - order: 7
        heading: "Reporting Compliance"
        subheading: "PRISMA, reporting, and academic tone checks"
        stages: ["G"]
        skill_refs:
          - prisma-checker
          - reporting-checker
          - tone-normalizer
      - order: 8
        heading: "Submission and Review"
        subheading: "Packaging, rebuttal, reviewer simulation, and limitations"
        stages: ["H"]
        skill_refs:
          - submission-packager
          - rebuttal-assistant
          - peer-review-simulation
          - fatal-flaw-detector
          - reviewer-empathy-checker
          - credit-taxonomy-helper
          - limitation-auditor
      - order: 9
        heading: "Research Code and Statistics"
        subheading: "Code planning, execution, review, reproducibility, and stats"
        stages: ["I"]
        skill_refs:
          - code-builder
          - data-cleaning-planner
          - data-merge-planner
          - code-specification
          - code-planning
          - code-execution
          - code-review
          - reproducibility-auditor
          - release-packager
          - stats-engine
      - order: 10
        heading: "Proofreading and Similarity"
        subheading: "Human voice, similarity, final proofread, and AI trace checks"
        stages: ["J"]
        skill_refs:
          - ai-fingerprint-scanner
          - human-voice-rewriter
          - similarity-checker
          - final-proofreader
      - order: 11
        heading: "Presentation"
        subheading: "Scholarly slide, Slidev, and Beamer workflows"
        stages: ["K"]
        skill_refs:
          - presentation-planner
          - slide-architect
          - slidev-scholarly-builder
          - beamer-builder
      - order: 12
        heading: "Cross-Cutting Governance"
        subheading: "Context, metadata, collaboration, boundaries, and self-critique"
        stages: ["Z"]
        skill_refs:
          - metadata-enricher
          - academic-context-maintainer
          - boundary-interviewer
          - model-collaborator
          - self-critique

