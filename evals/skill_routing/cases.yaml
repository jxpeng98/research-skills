      recommendation. "Question: Is study time associated with examination
      score? Methods: We recruited a convenience sample of 120 students and
      measured both variables once using self-report. Results: Pearson r = .32;
      precision estimates and adjusted models were not reported. Conclusion:
      Study time was positively associated with score; causality cannot be
      inferred." Review only this text and return the report in chat. Do not
      rewrite it or claim independent execution.
    zh: >-
      请对以下完整的合成短论文出具正式的审稿人风格报告，包括主要问题、存在时的次要
      问题，以及总体建议。“研究问题：学习时间是否与考试成绩相关？方法：我们便利抽取
      120名学生，对两个变量各进行一次自报测量。结果：Pearson r = .32，未报告精度估计
      或调整模型。结论：学习时间与成绩呈正相关，不能据此推断因果。”仅审查此文本，在
      聊天中返回报告，不改写论文，也不声称独立执行。
  expected:
    route: [skills/H_submission/peer-review-simulation.md]
    resource_route: [none]
    scope: [formal]
    next_action: [answer]

