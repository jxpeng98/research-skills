domain: economics
display_name: "Economics & Applied Microeconomics"

libraries:
  python:
    - linearmodels  # IV, panel (FE/RE/Between), system GMM
    - statsmodels   # OLS, GLS, 2SLS, time series
    - pyblp         # BLP demand estimation
    - rdrobust      # regression discontinuity
    - pyfixest      # fast high-dimensional FE (fixest port)
    - doubleml      # double/debiased ML for causal inference
    - causalinference  # matching, propensity score
    - stargazer     # regression table formatting
  r:
    - fixest        # fast multi-way FE, IV, Poisson
    - plm           # panel data models
    - rdrobust      # RD estimation + inference
    - did           # Callaway & Sant'Anna DID
    - didimputation # Borusyak, Jaravel, Spiess DID
    - synthdid      # synthetic DID
    - mlogit        # discrete choice
    - ivreg         # 2SLS / IV
    - marginaleffects  # marginal effects + contrasts
    - modelsummary  # publication-ready regression tables
    - MatchIt       # propensity score matching
  stata:
    - reghdfe       # high-dimensional FE regression
    - ivreghdfe     # IV with multi-way FE
    - did_imputation # imputation-based DID
    - csdid         # Callaway & Sant'Anna
    - rdrobust      # RD estimation
    - synth         # synthetic control
    - eventdd       # event study (Sun & Abraham)

method_templates:
  - name: "Difference-in-Differences (DID)"
    tier: standard
    library: fixest (R) / pyfixest (Python) / reghdfe (Stata)
    checklist:
      - "Pre-treatment parallel trends test (event study plot)"
      - "Use robust DID (Callaway-Sant'Anna / Sun-Abraham) for staggered treatment"
      - "Cluster SE at treatment-group level"
      - "Report pre-treatment balance table"
      - "Robustness: alternative control groups, placebo tests"
    assumptions:
      - "Untreated potential outcomes follow parallel trends conditional on fixed effects and controls."
      - "No anticipation or spillovers across treated and control units."
    required_diagnostics:
      - "Event-study pre-trend coefficients with joint pre-period test."
      - "Treatment timing and cohort support table."
    required_artifacts:
      - "Main DID table with clustered standard errors."
      - "Event-study plot and placebo or alternative-control robustness table."
    failure_modes:
      - "Staggered adoption with heterogeneous effects estimated by naive TWFE."
      - "Controls affected by treatment or spillovers contaminating comparison units."
    minimum_report_fields:
      - "Treatment definition, timing, unit, and comparison group."
      - "Estimator, fixed effects, clustering level, and identifying assumption."
    gate_relevance: [Q1, Q2, Q4]
    canonical_references:
      - citation_key: "callaway_santanna_2021_did"
        role: "Group-time treatment effects estimator for staggered adoption designs."
        source_url: "https://arxiv.org/abs/1803.09015"
      - citation_key: "sun_abraham_2021_eventstudy"
        role: "Event-study contamination warning for heterogeneous treatment effects."
        source_url: "https://doi.org/10.1016/j.jeconom.2020.09.006"
      - citation_key: "roth_santanna_bilinski_poe_2023_did"
        role: "Modern practice guide for DID design, estimation, and sensitivity."
        source_url: "https://arxiv.org/abs/2201.01194"
      - citation_key: "baker_callaway_cunningham_goodmanbacon_santanna_2025_did"
        role: "Recent practitioner guide for choosing among DID designs and estimators."
        source_url: "https://arxiv.org/abs/2503.13323"
    diagnostic_artifacts:
      - artifact: "RESEARCH/[topic]/analysis/did_event_study.md"
        required_for: "pre-trend, anticipation, and dynamic treatment-effect claims"
      - artifact: "RESEARCH/[topic]/analysis/did_cohort_support.md"
        required_for: "staggered-adoption and heterogeneous-effect claims"
    failure_triggers:
      - "No credible untreated or not-yet-treated comparison group for the treated units."
      - "Pre-treatment event-study coefficients show material divergence without a design response."
      - "A strong causal claim relies only on naive TWFE under staggered adoption with heterogeneous effects."

  - name: "Regression Discontinuity (RD)"
    tier: standard
    library: rdrobust
    checklist:
      - "Plot raw data with fitted polynomial on both sides"
      - "Use local polynomial with MSE-optimal bandwidth"
      - "McCrary density test for manipulation"
      - "Robustness: bandwidth sensitivity, different polynomial orders"
      - "Covariate balance at cutoff"
    assumptions:
      - "Potential outcomes are continuous at the cutoff absent treatment."
      - "Units cannot precisely manipulate the running variable around the cutoff."
    required_diagnostics:
      - "Density manipulation test at the cutoff."
      - "Bandwidth, polynomial order, and covariate balance sensitivity checks."
    required_artifacts:
      - "Binned RD plot with fitted local polynomials."
      - "RD estimate table across bandwidth and polynomial specifications."
    failure_modes:
      - "Endogenous sorting or heaping around the cutoff."
      - "Overfit global polynomials or selectively chosen bandwidths."
    minimum_report_fields:
      - "Running variable, cutoff, treatment rule, bandwidth, and kernel."
      - "Local estimate, robust confidence interval, and effective sample size."
    gate_relevance: [Q1, Q2, Q4]
    canonical_references:
      - citation_key: "imbens_kalyanaraman_2012_rd_bandwidth"
        role: "Bandwidth selection anchor for sharp RD designs."
        source_url: "https://doi.org/10.1093/restud/rdr043"
      - citation_key: "calonico_cattaneo_titiunik_2014_rdrobust"
        role: "Robust bias-corrected RD inference anchor."
        source_url: "https://doi.org/10.3982/ECTA11757"
      - citation_key: "cattaneo_idrobo_titiunik_2020_rd_practical"
        role: "Practical RD design, diagnostics, and reporting guide."
        source_url: "https://rdpackages.github.io/references/Cattaneo-Idrobo-Titiunik_2020_CUP.pdf"
    diagnostic_artifacts:
      - artifact: "RESEARCH/[topic]/analysis/rd_density_manipulation.md"
        required_for: "claims that units cannot precisely sort around the cutoff"
      - artifact: "RESEARCH/[topic]/analysis/rd_bandwidth_sensitivity.md"
        required_for: "local treatment-effect and bandwidth robustness claims"
    failure_triggers:
      - "Manipulation or heaping around the cutoff undermines local random assignment."
      - "The bandwidth or polynomial order is selected after inspecting favorable estimates."
      - "Global polynomial evidence is treated as the primary RD identification result."

  - name: "Instrumental Variables (2SLS)"
    tier: standard
    library: linearmodels / ivreg / ivreghdfe
    checklist:
      - "First-stage F-stat > 10 (Stock-Yogo critical values)"
      - "Exclusion restriction argument (narrative, not testable)"
      - "Over-identification test (Sargan/Hansen J) if >1 instrument"
      - "Reduced-form estimate for interpretation"
      - "Weak instrument robust inference (Anderson-Rubin)"
    assumptions:
      - "Instrument relevance after included controls and fixed effects."
      - "Instrument affects the outcome only through the endogenous regressor."
    required_diagnostics:
      - "First-stage strength statistics and reduced-form estimates."
      - "Overidentification and weak-instrument robust inference where applicable."
    required_artifacts:
      - "First-stage, reduced-form, and second-stage tables."
      - "Instrument construction and exclusion-restriction rationale."
    failure_modes:
      - "Weak instruments producing biased and imprecise 2SLS estimates."
      - "Instrument exclusion violations through omitted mechanisms."
    minimum_report_fields:
      - "Endogenous regressor, instrument set, first-stage coefficient, and F-statistic."
      - "Estimator, controls, fixed effects, clustering, and local effect interpretation."
    gate_relevance: [Q1, Q2, Q4]
    canonical_references:
      - citation_key: "angrist_imbens_rubin_1996_iv"
        role: "Local average treatment effect and monotonicity anchor."
        source_url: "https://doi.org/10.1080/01621459.1996.10476902"
      - citation_key: "stock_yogo_2005_weak_instruments"
        role: "Weak-instrument diagnostics and critical values anchor."
        source_url: "https://www.nber.org/papers/t0284"
      - citation_key: "andrews_stock_sun_2019_weak_iv"
        role: "Recent weak-instrument inference review."
        source_url: "https://doi.org/10.1146/annurev-economics-080218-025643"
    diagnostic_artifacts:
      - artifact: "RESEARCH/[topic]/analysis/iv_first_stage_weak_instrument.md"
        required_for: "instrument relevance and weak-instrument risk claims"
      - artifact: "RESEARCH/[topic]/analysis/iv_exclusion_overidentification.md"
        required_for: "exclusion-restriction and overidentification claims"
    failure_triggers:
      - "First-stage evidence is weak or not reported for the endogenous regressor."
      - "The exclusion restriction depends on an unaddressed direct path to the outcome."
      - "The paper interprets a LATE estimate as an average treatment effect without scope limits."

  - name: "Synthetic Control"
    tier: advanced
    library: synth (Stata) / synthdid (R)
    checklist:
      - "Pre-treatment fit quality (RMSPE)"
      - "Placebo tests (in-space and in-time)"
      - "Donor pool selection criteria documented"
    assumptions:
      - "Weighted donor pool approximates the treated unit's untreated counterfactual."
      - "No donor unit receives spillovers from the treatment."
    required_diagnostics:
      - "Pre-treatment RMSPE and predictor balance comparison."
      - "In-space and in-time placebo distribution."
    required_artifacts:
      - "Treated versus synthetic outcome path plot."
      - "Donor weights, predictor balance, and gap plot."
    failure_modes:
      - "Poor pre-treatment fit undermining counterfactual credibility."
      - "Donor pool contamination or post-treatment predictor selection."
    minimum_report_fields:
      - "Treated unit, intervention date, donor pool, predictors, and optimization window."
      - "Fit metrics, placebo rank, and post-treatment effect summary."
    gate_relevance: [Q1, Q2, Q4]
    canonical_references:
      - citation_key: "abadie_gardeazabal_2003_synthetic_control"
        role: "Foundational synthetic control policy evaluation anchor."
        source_url: "https://doi.org/10.1257/000282803321455188"
      - citation_key: "abadie_diamond_hainmueller_2010_synthetic_control"
        role: "JASA synthetic control estimator and placebo inference anchor."
        source_url: "https://doi.org/10.1198/jasa.2009.ap08746"
      - citation_key: "abadie_2021_using_synthetic_controls"
        role: "Modern synthetic control practice and reporting guide."
        source_url: "https://doi.org/10.1257/jel.20191450"
    diagnostic_artifacts:
      - artifact: "RESEARCH/[topic]/analysis/synthetic_control_prefit.md"
        required_for: "counterfactual credibility and predictor balance claims"
      - artifact: "RESEARCH/[topic]/analysis/synthetic_control_placebos.md"
        required_for: "in-space or in-time placebo inference claims"
    failure_triggers:
      - "Poor pre-treatment fit makes the synthetic counterfactual non-credible."
      - "Donor units are exposed to treatment spillovers or selected using post-treatment outcomes."
      - "Placebo rankings or RMSPE ratios are omitted while making strong effect claims."

  - name: "BLP Demand Estimation"
    tier: advanced
    library: pyblp
    checklist:
      - "Instrument validity (BLP/Hausman/Gandhi-Houde)"
      - "Convergence diagnostics for GMM"
      - "Report elasticity matrix and markup estimates"
    assumptions:
      - "Product-market shares arise from the specified random-coefficients demand system."
      - "Demand shocks are orthogonal to excluded instruments."
    required_diagnostics:
      - "GMM convergence, gradient, and objective value diagnostics."
      - "Instrument relevance and sensitivity to alternative instrument sets."
    required_artifacts:
      - "Elasticity, diversion, and markup tables."
      - "Instrument summary and model convergence log."
    failure_modes:
      - "Weak or invalid instruments for endogenous prices."
      - "Non-convergence or economically implausible substitution patterns."
    minimum_report_fields:
      - "Market definition, products, shares, outside option, and price endogeneity treatment."
      - "Random coefficients, instruments, GMM settings, elasticities, and markups."
    gate_relevance: [Q1, Q2, Q4]
    canonical_references:
      - citation_key: "berry_levinsohn_pakes_1995_blp"
        role: "Random-coefficients demand and supply equilibrium anchor."
        source_url: "https://doi.org/10.2307/2171802"
      - citation_key: "nevo_2001_cereal_demand"
        role: "Applied random-coefficients demand estimation anchor."
        source_url: "https://doi.org/10.1111/1468-0262.00194"
      - citation_key: "conlon_gortmaker_2020_pyblp"
        role: "Modern computational best-practice anchor for BLP-style estimation."
        source_url: "https://doi.org/10.1111/1756-2171.12352"
    diagnostic_artifacts:
      - artifact: "RESEARCH/[topic]/analysis/blp_gmm_convergence.md"
        required_for: "GMM convergence and numerical reliability claims"
      - artifact: "RESEARCH/[topic]/analysis/blp_instruments_elasticities.md"
        required_for: "instrument validity, substitution, elasticity, and markup claims"
    failure_triggers:
      - "Price endogeneity is not addressed with credible excluded instruments."
      - "The GMM routine fails to converge or reports unstable objective and gradient diagnostics."
      - "Elasticities, diversion ratios, or markups are economically implausible without sensitivity analysis."

stats_diagnostics:
  - "Parallel trends: event study coefficients + joint F-test on pre-periods"
  - "First-stage strength: Kleibergen-Paap / Cragg-Donald F-stat"
  - "Clustering: cluster at appropriate level (state, firm, individual)"
  - "Functional form: RESET test, Box-Cox if necessary"
  - "Heterogeneous treatment effects: CATE estimation or subgroup analysis"

reporting_guidelines:
  primary: "AER / QJE / Econometrica style"
  checklists:
    - "Balance/summary statistics table"
    - "Main regression table with progressive controls"
    - "Event study / RD plot"
    - "Robustness and placebo tables"

common_pitfalls:
  - "Staggered DID with TWFE → biased estimates (use robust estimators)"
  - "Clustering SE at wrong level (too narrow → over-rejection)"
  - "Weak instruments → misleading 2SLS (use tF > 10 rule)"
  - "Cherry-picking bandwidth in RD (report MSE-optimal + sensitivity)"
  - "P-hacking via specification search (pre-register primary spec)"
  - "Bad controls: conditioning on post-treatment variables"
  - "SUTVA violations in network/spillover settings"

visualization_templates:
  - "Event study plot (pre/post treatment coefficients with CI)"
  - "RD plot (binned scatter + fitted polynomial)"
  - "Coefficient plot (coefplot) with multiple specifications"
  - "Parallel trends diagnostic plot"
  - "Synthetic control gap plot (treated vs synthetic)"

reporting_standards:
  primary: "AER/QJE style"
  checklists: [STROBE]
  required_tables:
    - "Summary statistics / balance table"
    - "Main regression with progressive controls"
    - "Robustness / placebo tests"

default_databases:
  primary: [SSRN, NBER, RePEc, EconLit]
  secondary: [Google Scholar, Scopus, Web of Science]
  preprints: [SSRN, NBER Working Papers]
  query_syntax_notes: "EconLit uses controlled vocabulary (JEL codes); SSRN uses free text"

methodology_priors:
  identification: "Requires credible causal identification strategy"
  robustness: "Minimum 3 robustness checks expected"
  standard_hierarchy: [RCT, IV, RD, DID, Matching, OLS]
  estimation_norms: "Report clustered SE, show progressive controls"

venue_norms:
  aer:
    sections: [Introduction, Model, Data, Results, Conclusion]
    word_limit: 15000
    appendix: "Online appendix expected for proofs + robustness"
    code_release: "Required (AEA Data & Code Repository)"
  qje:
    sections: [Introduction, Background, Data, Empirical_Strategy, Results, Conclusion]
    word_limit: 12000
    code_release: "Expected"
  restud:
    sections: [Introduction, Model, Data, Results, Conclusion]
    word_limit: 15000
    code_release: "Required"
